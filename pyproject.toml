[project]
name = "aquamind"
version = "0.1.0"
description = "AquaMind: leak investigation with sparse sensors, citizen reports and a gated agent"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aquamind*"]
