# L-Town (BattLeDIM 2020): the main network of the proposal.
network: ltown
nominal_inp: data/raw/ltown/L-TOWN.inp          # the utility's model: every method infers with this one
real_inp: data/raw/ltown/L-TOWN_Real.inp        # official truth model (only the simulator uses it)
assets: data/ltown                              # built by scripts/build_assets.py
step_s: 300                                     # hydraulic + pattern step
report_step_s: 900                              # stored time series resolution (15 min)

# the 33 real BattLeDIM pressure-sensor locations; layouts of 3 / 5 / 10 sensors are drawn from these
pressure_candidates: [n1, n4, n31, n54, n105, n114, n163, n188, n215, n229, n288, n296, n332, n342, n410, n415,
                      n429, n458, n469, n495, n506, n516, n519, n549, n613, n636, n644, n679, n722, n726, n740,
                      n752, n769]
flow_links: [p227, p235, PUMP_1]                # zone A inlets (2) and the pump that fills tank T1 (zone C)
tank_levels: [T1]

signatures:                                     # leak fingerprints on the nominal model (scripts/build_assets.py)
  sizes_lps: [1.0, 3.0, 6.0]
  windows_h: {night: [2, 4], day: [10, 12]}
  duration_h: 40
  weekday_offset_days: 2
