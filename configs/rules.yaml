  max_two_digs: {sop: SOP-2, max: 2}
  step_test_needs_approval: {sop: SOP-3}
  no_action_from_untrusted_text: {sop: SOP-4}
procedure:
  school_hours: {sop: SOP-5, radius_m: 100, start: "07:30", end: "16:30", weekdays_only: true}
  resurfaced_permit:
    sop: SOP-6
